[package]
name = "agent"
version = "1.3.2"
description = "ChatBuddy workspace"
edition = "2021"
rust-version = "1.80"

[lib]
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
mdns-sd = "0.21.7"
if-addrs = "0.15.0"
tokio = { version = "1.53.3", features = ["net", "time", "io-util", "sync", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
